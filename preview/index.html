<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf3">
  <title>Jyotish Sutra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell" aria-label="Jyotish Sutra mobile application preview">
    <div class="camera" aria-hidden="true"></div>
    <div class="status-bar"><span>9:41</span><span class="status-icons">● ◢ ▮</span></div>
    <section id="app" class="app"></section>
    <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation">
      <button data-screen="home" class="active"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button data-screen="planets"><span class="nav-icon bars">▮▮▮</span><span>Insights</span></button>
      <button data-screen="tools"><span class="nav-icon grid">▦</span><span>Tools</span></button>
      <button data-screen="settings"><span class="nav-icon">♙</span><span>Profile</span></button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
